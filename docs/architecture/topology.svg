<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background:#111827; font-family:Inter, system-ui, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f9fafb" font-size="18" font-weight="700" letter-spacing="1">iREADME ENTERPRISE TOPOLOGY (MULTI-AI ARCHITECTURE)</text>

  <!-- Box 1: Multi-AI Ingestion -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="180" height="180" rx="8" fill="url(#grad1)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">INGESTION PLANE</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="25" y="70" fill="#d1d5db" font-size="11">• Google Antigravity</text>
    <text x="25" y="95" fill="#d1d5db" font-size="11">• Anthropic Claude</text>
    <text x="25" y="120" fill="#d1d5db" font-size="11">• OpenAI ChatGPT</text>
    <text x="25" y="145" fill="#d1d5db" font-size="11">• Cursor IDE</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 160 L 255 160" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="255,156 265,160 255,164" fill="#9ca3af"/>

  <!-- Box 2: Governance & Invariants -->
  <g transform="translate(265, 70)" filter="url(#shadow)">
    <rect width="180" height="180" rx="8" fill="url(#grad1)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">GOVERNANCE PLANE</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="25" y="70" fill="#d1d5db" font-size="11">• GEMINI.md / AGENTS</text>
    <text x="25" y="95" fill="#d1d5db" font-size="11">• CLAUDE.md / RULES</text>
    <text x="25" y="120" fill="#d1d5db" font-size="11">• Zero Path Invariant</text>
    <text x="25" y="145" fill="#d1d5db" font-size="11">• Zero Emojis Rule</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="480,156 490,160 480,164" fill="#9ca3af"/>
  <line x1="445" y1="160" x2="480" y2="160" stroke="#9ca3af" stroke-width="2"/>

  <!-- Box 3: Core Kernel -->
  <g transform="translate(490, 70)" filter="url(#shadow)">
    <rect width="180" height="180" rx="8" fill="url(#grad1)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">ANALYTICAL KERNEL</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="25" y="70" fill="#d1d5db" font-size="11">• KaTeX Formulation</text>
    <text x="25" y="95" fill="#d1d5db" font-size="11">• Relative Path Filter</text>
    <text x="25" y="120" fill="#d1d5db" font-size="11">• Safe Atomic Writer</text>
    <text x="25" y="145" fill="#d1d5db" font-size="11">• Dual Synchronizer</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="705,156 715,160 705,164" fill="#9ca3af"/>
  <line x1="670" y1="160" x2="705" y2="160" stroke="#9ca3af" stroke-width="2"/>

  <!-- Box 4: Verified Output -->
  <g transform="translate(715, 70)" filter="url(#shadow)">
    <rect width="145" height="180" rx="8" fill="url(#grad1)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="72" y="30" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">OUTPUT PLANE</text>
    <line x1="15" y1="42" x2="130" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="20" y="70" fill="#d1d5db" font-size="11">• README.md</text>
    <text x="20" y="95" fill="#d1d5db" font-size="11">• README_ES.md</text>
    <text x="20" y="120" fill="#d1d5db" font-size="11">• Pytest Suites</text>
    <text x="20" y="145" fill="#d1d5db" font-size="11">• 100% Invariants</text>
  </g>

  <!-- Footer info -->
  <text x="450" y="295" text-anchor="middle" fill="#9ca3af" font-size="11">Standard: Enterprise Paper-Grade v2.0 | Engine: iReadme Universal</text>
</svg>
